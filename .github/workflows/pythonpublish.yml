name: Upload Python Package

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce70c38
        with:
          python-version: '3.x'
      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build
      - name: Upload release distributions
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf88f
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      id-token: write
      contents: read
    environment: release
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@fa0a91b85d4f404e44d800e3a702b8d42d0979a4
        with:
          name: release-dists
          path: dist/
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@e9ccbe5a211ba3e8363f472cae362b56b104e796
