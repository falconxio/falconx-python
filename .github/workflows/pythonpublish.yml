name: Upload Python Package

on:
  release:
    types: [created]

jobs:
  release-build:
    runs-on: ubuntu-2core
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@85e6279cec87321a52edac9c87bce653a07cf6c2
      - name: Set up Python
        uses: actions/setup-python@19e4675e06535f6b54e894da5c1f044400bb4996
        with:
          python-version: '3.x'
      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build
      - name: Upload release distributions
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-2core
    needs: release-build
    permissions:
      id-token: write
    environment: release
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@448e3f862ab3ef47aa50ff917776823c9946035b
        with:
          name: release-dists
          path: dist/
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@e9ccbe5a211ba3e8363f472cae362b56b104e796
